# IP Finder 설정 예시. 이 파일을 ip_finder.toml 로 복사해 설치 폴더(또는 실행하는 현재 폴더)에 두면 자동으로 읽는다.
# UI '페이지 가중치 → 설정 저장'으로 만들 수도 있다. 회사 템플릿의 제목어와 고정 문구를 여기에 적는다.
# 캐시·분류기·이력은 기본적으로 설치 폴더의 data/ 아래에 생기며, 설치본마다 완전히 따로 관리된다. 상대 경로는 이 파일의 폴더 기준.

model = "qwen3:4b-instruct"          # 정확도 우선이면 "qwen3:8b" (thinking 계열도 자동으로 think=false)
host = "http://127.0.0.1:11434"      # 로컬 주소만 허용
mode = "hybrid"                      # hybrid | fast | llm
embed_model = "bge-m3"               # KURE-v1 을 들여왔으면 "kure-v1"
# confidence_threshold = 0.25        # 비우면 제로샷 0.05 / 학습 분류기 0.25
verify_grades = ""                   # "A" 또는 "A,B": 분류기가 채택한 해당 등급을 LLM으로 재확인 (정밀도 ↑, 시간 ↑)

# ---- 정밀도 우선: 페이지 가중치와 점수 ----
accept_score = 0.5                   # 신뢰도 × 가중치 가 이 값 이상이어야 검토 목록. 미만은 보류 시트
# 제목 키워드 규칙 (정규식, 먼저 맞는 것). 가중치 0 이면 페이지를 판정하지 않는다
page_weights = [
  ["(고객|클레임|영업|매출|수주|회의|교육|인사|채용|복지)", 0.3],
  ["(현황|실적|진행\\s*상황|동향|추진\\s*경과|경과)", 0.4],
  # ["Action\\s*Plan", 0.6],
  # ["(품질\\s*지표|KPI)", 0.0],
]

# ---- 전처리와 후처리 ----
split_len = 80                       # 이 길이를 넘는 줄은 문장 분할
repeated_line_min_pages = 3          # 이 수 이상 페이지에 같은 줄이 있으면 머리말·바닥글로 제거
stoplist = ["대외비", "Confidential"] # 템플릿의 고정 문구
page_exclude_patterns = ["목\\s*차", "차례", "contents", "agenda", "일정", "스케줄", "schedule", "비용", "예산", "투자비", "cost", "budget", "조직", "인력", "담당자", "체계도", "감사합니다", "thank", "q\\s*&\\s*a", "질의", "참고\\s*문헌", "references", "부록", "appendix"]
title_fix = true                     # 원인·문제 페이지의 변경 동사 없는 A → C
safety_net = true                    # X 인데 기술 단서어가 있으면 X? 로 보류 시트에
use_cache = true
cache_path = "data/cache.sqlite"        # 판정·임베딩 캐시 (원문 미저장)
classifier_path = "data/classifier.npz" # ip-finder train 결과. 없으면 제로샷
history_path = "data/history"           # 실행 이력(원문 미저장). "" 이면 저장 안 함
gold_paths = ["data/gold"]              # 골드 파일·폴더(*_gold.xlsx). 첫 폴더가 feedback/gold-sheet 의 저장 위치
use_gold = true                         # 골드에 있는 문장은 새 실행에서 모델 판정 대신 골드 정답을 그대로 씀

# 유형별 기본 가중치 (키워드 규칙에 없는 제목). TOML 규칙상 테이블은 파일 끝에 둔다
[page_type_weights]
means = 1.0      # 개선안·설계·구조·알고리즘
result = 0.9     # 결과·검증·효과
problem = 0.8    # 원인·문제·배경
plan = 0.75      # 계획·향후
status = 0.4     # 현황·실적·요약
general = 0.8    # 유형을 모르는 제목