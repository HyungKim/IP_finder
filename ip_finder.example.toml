# IP Finder 설정 예시 (1.0 rebuild). 이 파일을 ip_finder.toml 로 복사해 설치 폴더(또는 실행하는 현재 폴더)에 두면 자동으로 읽는다.
# UI '설정 저장'으로 만들 수도 있다. 캐시·분류기·이력·골드는 설치 폴더의 data/ 아래에 생기고 설치본마다 따로 관리된다. 상대 경로는 이 파일의 폴더 기준.

# ---- 1차 분류기 ----
classifier = "proto"                 # proto(원형 문장 코사인, 학습 없음) | knn | centroid | softmax | ovr | cue(단서어 규칙) | ngram(글자 n-gram)
embed_model = "bge-m3"               # 임베딩 모델 (KURE-v1 을 들여왔으면 "kure-v1"). cue·ngram 은 쓰지 않는다
classifier_dir = "data/classifiers"  # ip-finder train 이 만드는 <이름>.npz 폴더
knn_k = 5
baseline_classifiers = true          # 비교 기준선용 분류기(cue, ngram)를 compare-classifiers 기본 대상과 UI 선택지에 넣을지. 결과에는 영향 없음
target_grades = "A,B"                # 추출 대상 등급. "A,B,C,D" 로 넓힐 수 있음
accept_score = 0.5                   # 신뢰도 × 가중치 가 이 값 이상이어야 검토 목록. 미만은 보류 시트

# ---- 스위치: 기본 전부 false = 기준선. ip-finder switches 로 목록을 본다 ----
layout_analysis = false              # 읽기: 레이아웃 분석 (다단 순서, 문단 묶기, 제목·표·도형, ▪| 항목 나누기)
rule_short_line = false              # 줄: 공백 제외 short_line_chars 이하 제외
rule_require_korean = false          # 줄: 한글 없는 줄 제외
rule_split_long = false              # 줄: split_len 넘는 줄을 문장으로 분할
rule_repeated_line = false           # 줄: repeated_line_min_pages 쪽 이상 반복되는 줄과 stoplist 제외
rule_pattern_lines = false           # 줄: 숫자만·담당자·짧은 일정/금액 줄 제외
rule_page_exclude = false            # 쪽: 제목이 page_exclude_patterns 에 걸리는 쪽 제외
rule_cover = false                   # 쪽: 1쪽이 cover_max_lines 이하이면 표지로 제외
page_weight_enabled = false          # 쪽: 관련성 낮음 가중치 적용
title_fix = false                    # 후처리: 원인·문제 쪽의 변경 동사 없는 A → C
safety_net = false                   # 후처리: 단서어 있는 X → X? (보류)

# ---- 규칙 매개변수 (해당 스위치를 켰을 때만) ----
short_line_chars = 10
split_len = 80
repeated_line_min_pages = 3
stoplist = ["대외비", "Confidential"]
page_exclude_patterns = ["목\\s*차", "차례", "contents", "agenda", "일정", "스케줄", "schedule", "비용", "예산", "투자비", "cost", "budget", "조직", "인력", "담당자", "체계도", "감사합니다", "thank", "q\\s*&\\s*a", "질의", "참고\\s*문헌", "references", "부록", "appendix"]
cover_max_lines = 4
low_relevance_patterns = ["(고객|클레임|영업|매출|수주|회의|교육|인사|채용|복지)", "(현황|실적|진행\\s*상황|동향|추진\\s*경과|경과)"]
high_relevance_patterns = []
low_relevance_weight = 0.4

# ---- 캐시·이력·골드 ----
# 버전별 폴더를 나란히 둘 때는 골드와 캐시만 공유 폴더를 절대 경로로 가리키고(예: "C:/IPF/shared/gold", "C:/IPF/shared/cache.sqlite"),
# 이력(history_path)과 학습 분류기(classifier_dir)는 버전마다 따로 둔다. README '버전별 폴더로 나란히 운용하기' 참고.
use_cache = true
cache_path = "data/cache.sqlite"        # 임베딩 캐시 (원문 미저장)
history_path = "data/history"           # 실행 이력(원문 미저장). "" 이면 저장 안 함
gold_paths = ["data/gold"]              # 골드 파일·폴더(*_gold.xlsx)
use_gold = true                         # 골드에 있는 문장은 새 실행에서 분류기 판정 대신 골드 정답 (실험 명령은 자동으로 끔)
